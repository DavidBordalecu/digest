<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo maestro de Digest (512x512).

  Este archivo es la fuente de verdad del diseño. El icono que ve el
  usuario sale de aquí: las versiones del lanzador se generan con

      rsvg-convert -w 512 -h 512 logo/logo.svg -o logo512.png

  y de ese PNG se derivan los iconos adaptativos y los de la ficha de
  Play Store. Si hay que cambiar el logo, se toca solo este archivo.

  La marca es el marco del colon: un trazo continuo que sube por el colon
  ascendente, cruza en el transverso, baja por el descendente y remata en
  el sigma. Se eligió porque se reconoce de un vistazo incluso a 48 px,
  que es el tamaño real de un icono en la pantalla del móvil.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12949B"/>
      <stop offset="55%" stop-color="#00696E"/>
      <stop offset="100%" stop-color="#32474E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#fondo)"/>

  <path
    d="M176,356
       C160,316 154,246 156,192
       C157,166 180,152 206,152
       L318,152
       C344,152 367,166 368,192
       C370,250 366,298 362,328
       C356,366 318,380 290,358
       C268,340 272,310 296,302"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>